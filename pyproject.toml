[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localpilot"
version = "0.1.0"
description = "A verification-first coding harness for small, local LLMs."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }

[project.scripts]
localpilot = "agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: needs a running local model server (excluded in CI)",
]
